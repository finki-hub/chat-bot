[project]
name = "gpu-api"
version = "0.1.0"
requires-python = ">=3.14,<3.15"
dependencies = [
  "fastapi[all]>=0.141.1",
  "gunicorn>=26.2.0",
  "langchain-huggingface>=1.2.2",
  "posthog>=7.44.2",
  "sentence-transformers>=5.7.0",
  "torch>=2.13.0",
  "transformers>=5.15.1",
]

[dependency-groups]
dev = [
  "anyio>=4.14.2",
  "mypy>=2.3.1",
  "pytest>=9.1.1",
  "ruff>=0.16.4",
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cu130", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
  { index = "pytorch-cu130", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[tool.mypy]
python_version = "3.14"
plugins = ["pydantic.mypy"]
check_untyped_defs = true
no_implicit_optional = true
show_error_codes = true
warn_redundant_casts = true
warn_unused_configs = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["app", "app.*", "gunicorn.conf"]
disallow_any_generics = true
disallow_incomplete_defs = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_decorators = true
disallow_untyped_defs = true
extra_checks = true
no_implicit_reexport = true
strict_equality = true
strict_equality_for_none = true
warn_unreachable = true
warn_return_any = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = ["-ra", "--strict-config", "--strict-markers"]
xfail_strict = true

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["ALL"]
preview = true
explicit-preview-rules = true
extend-select = ["fast-api-non-annotated-dependency", "fallible-context-manager", "noqa-comments", "rule-codes-in-selectors"]
ignore = [
  "missing-trailing-comma",
  "missing-copyright-notice",
  "D",
  "DOC",
  "line-too-long",
  "EM",
  "FBT",
  "single-line-implicit-string-concatenation",
  "complex-structure",
  "too-many-return-statements",
  "too-many-branches",
  "too-many-arguments",
  "too-many-locals",
  "too-many-statements",
  "magic-value-comparison",
  "too-many-statements-in-try-clause",
  "unnecessary-assign",
  "ambiguous-unicode-character-string",
  "unused-async",
  "TC",
  "raise-vanilla-args",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
  "ANN",
  "ARG",
  "implicit-namespace-package",
  "import-private-name",
  "no-self-use",
  "assert",
  "private-member-access",
  "print",
]

[tool.ruff.format]
docstring-code-format = true
