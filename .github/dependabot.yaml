version: 2
updates:
  - package-ecosystem: 'uv'
    directory: '/api'
    schedule:
      interval: 'daily'

  - package-ecosystem: 'uv'
    directory: '/gpu-api'
    schedule:
      interval: 'daily'

  - package-ecosystem: 'npm'
    directory: '/web'
    schedule:
      interval: 'daily'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'daily'

  - package-ecosystem: 'docker'
    directory: '/api'
    schedule:
      interval: 'daily'
    ignore:
      # Keep the builder and final image on Python 3.14; bump manually.
      - dependency-name: 'ghcr.io/astral-sh/uv'
        update-types:
          - 'version-update:semver-major'
          - 'version-update:semver-minor'
      - dependency-name: 'python'
        update-types:
          - 'version-update:semver-major'
          - 'version-update:semver-minor'

  - package-ecosystem: 'docker'
    directory: '/gpu-api'
    schedule:
      interval: 'daily'
    ignore:
      # Keep the builder and final image on Python 3.14; bump manually.
      - dependency-name: 'ghcr.io/astral-sh/uv'
        update-types:
          - 'version-update:semver-major'
          - 'version-update:semver-minor'
      - dependency-name: 'python'
        update-types:
          - 'version-update:semver-major'
          - 'version-update:semver-minor'

  - package-ecosystem: 'docker'
    directory: '/web'
    schedule:
      interval: 'daily'
