name: Tests (Web)

on:
  push:
    branches: [main, dev]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vitest:
    uses: finki-hub/.github/.github/workflows/vitest.yaml@main
    with:
      node-version: "26"
      working-directory: ./web
    secrets: inherit
