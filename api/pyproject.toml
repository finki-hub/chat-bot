[project]
name = "api"
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "asyncpg>=0.31.0",
    "cryptography>=50.0.0",
    "fastapi[all]>=0.141.1",
    "gunicorn>=26.0.0",
    "httpx>=0.28.1",
    "langchain>=1.3.15",
    "langchain-anthropic>=1.6.1",
    "langchain-google-genai>=4.3.4",
    "langchain-mcp-adapters>=0.3.2",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=1.6.0",
    "langchain-openrouter>=0.2.8",
    "langchain-text-splitters>=1.1.2",
    "langgraph>=1.2.10",
    "posthog>=7.39.1",
    "pydantic>=2.13.4",
    "tzdata>=2026.3",
]

[dependency-groups]
dev = [
    "asyncpg-stubs>=0.31.3",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.3",
]

[tool.mypy]
python_version = "3.14"
plugins = ["pydantic.mypy"]
check_untyped_defs = true
no_implicit_optional = true
show_error_codes = true
warn_redundant_casts = true
warn_unused_configs = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["app", "app.*", "gunicorn.conf"]
disallow_any_generics = true
disallow_incomplete_defs = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_decorators = true
disallow_untyped_defs = true
extra_checks = true
no_implicit_reexport = true
strict_equality = true
strict_equality_for_none = true
warn_unreachable = true
warn_return_any = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pyright]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = ["-ra", "--strict-config", "--strict-markers"]
xfail_strict = true

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["ALL"]
preview = true
explicit-preview-rules = true
extend-select = ["fast-api-non-annotated-dependency", "fallible-context-manager", "noqa-comments", "rule-codes-in-selectors"]
ignore = [
    "missing-trailing-comma",
    "missing-copyright-notice",
    "D",
    "DOC",
    "line-too-long",
    "EM",
    "FBT",
    "single-line-implicit-string-concatenation",
    "complex-structure",
    "too-many-return-statements",
    "too-many-branches",
    "too-many-arguments",
    "too-many-locals",
    "too-many-statements",
    "magic-value-comparison",
    "too-many-statements-in-try-clause",
    "unnecessary-assign",
    "ambiguous-unicode-character-string",
    "unused-async",
    "TC",
    "raise-vanilla-args",
]

[tool.ruff.lint.per-file-ignores]
"app/api/diplomas.py" = ["call-datetime-strptime-without-zone"]
"app/data/questions.py" = ["noqa-comments"]
"app/utils/settings.py" = ["noqa-comments"]
"gunicorn.conf.py" = ["unused-function-argument"]
"tests/**" = [
    "ANN",
    "ARG",
    "blocking-path-method-in-async-function",
    "implicit-namespace-package",
    "import-private-name",
    "no-self-use",
    "noqa-comments",
    "assert",
    "private-member-access",
    "print",
    "unused-noqa",
]

[tool.ruff.format]
docstring-code-format = true
